<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Notes App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="sidebar">
  <div class="bar"><b>Sections</b><button id="add-section" title="New section">+</button></div>
  <ul id="sections"></ul>
  <div class="bar"><b>Notes</b><button id="add-note" title="New note">+</button></div>
  <input id="search" placeholder="Search notes…">
  <ul id="notes"></ul>
</aside>
<main>
  <div class="bar" id="topbar">
    <input id="title" placeholder="Title">
    <button class="tab" data-view="text">Markdown</button>
    <button class="tab" data-view="canvas">Canvas</button>
    <button class="tab" data-view="map">Map</button>
    <button class="tab" data-view="graph">Link graph</button>
    <button id="delete-note">Delete note</button>
  </div>
  <div id="toolbar" class="bar hidden"></div>
  <div id="view-text" class="view"><textarea id="editor"></textarea><div id="preview"></div></div>
  <div id="view-canvas" class="view hidden"><div id="canvas"></div></div>
  <div id="view-map" class="view hidden"><svg id="map"></svg></div>
  <div id="view-graph" class="view hidden"><svg id="graph"></svg></div>
</main>
<script src="../lib/markdown.js"></script>
<script src="../lib/store.js"></script>
<script src="app.js"></script>
</body>
</html>
